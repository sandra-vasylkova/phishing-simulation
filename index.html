<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="code.js" defer></script>
    <title>Phishing Awareness Demo</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .warning {
        margin: 14px 0 18px;
        padding: 12px;
        background: #fff7ed;
        border: 1px solid #fdba74;
        color: #9a3412;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.4;
      }

      .card {
        width: 360px;
        background: white;
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      }

      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #555;
        font-size: 14px;
        margin-bottom: 22px;
      }

      label {
        display: block;
        margin-top: 14px;
        font-size: 14px;
        font-weight: bold;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .result {
        display: none;
        margin-top: 24px;
        padding: 16px;
        background: #fee2e2;
        border: 1px solid #fca5a5;
        color: #7f1d1d;
        border-radius: 10px;
        font-size: 14px;
      }

      .result strong {
        display: block;
        margin-bottom: 8px;
      }

      .data {
        margin-top: 10px;
        padding: 10px;
        background: white;
        border-radius: 8px;
        border: 1px solid #fecaca;
        word-break: break-word;
      }

      .note {
        margin-top: 18px;
        font-size: 12px;
        color: #777;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Schulportal Anmeldung</h1>
      <p class="subtitle">Bitte bestätigen Sie Ihre Identität.</p>

      <p class="warning">
        ⚠️ Bitte geben Sie nur erfundene Testdaten ein und niemals echte
        Benutzernamen oder Passwörter.
      </p>

      <form id="demoForm">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          placeholder="Geben Sie Ihren Benutzernamen ein"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Geben Sie Ihr Passwort ein"
          required
        />

        <button type="submit">Anmelden</button>
      </form>

      <p
        id="successMessage"
        style="display: none; color: green; margin-top: 16px"
      >
        Erfolgreich gespeichert.
      </p>
    </div>
  </body>
</html>
